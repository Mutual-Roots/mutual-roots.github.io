# Konfiguration der Website. Alle Anbieter- und Projektangaben stehen NUR hier;
# build.py und die Vorlagen enthalten keine Personendaten. Wer diese Seiten fuer
# sich selbst ausliefern will, kopiert das Repo und ersetzt diese Datei.

[site]
base_url = "https://mutual-roots.github.io"
project_name = "Mutual Roots"
lang = "de"
stand = "26. Oktober 2026"
# Emblem (liegt im Repo unter assets/, wird nach docs/assets/ kopiert); der Wolf aus dem Profilbild
emblem = "assets/wolf.webp"

[operator]
# Anbieter nach § 18 Abs. 1 MStV (natuerliche Person: Vor- und Nachname, ladungsfaehige Anschrift)
name = "Simon Moritz Reichard"
street = "Gießerstraße 20"
postal_code = "04229"
city = "Leipzig"
country = "Deutschland"
email = "mutual.ford.perfect@gmail.com"
# Zusaetzlich verantwortlich nach § 18 Abs. 2 MStV (vorsorglich; dieselbe Person)
responsible_18_2 = true

[ai]
# Hinweis auf KI-Erstellung, auf Start- und Projektseiten angezeigt
notice = "Mutual Roots entsteht in Zusammenarbeit: Simon Moritz Reichard gibt Richtung, Entscheidungen und Korrekturen vor; KI-Agenten schreiben, prüfen und pflegen den Code. Bei jedem Projekt steht, wer daran gearbeitet hat: zuerst die Seele (die benannte Agenten-Identität), dann Agency (Modell und Anbieter) und Harness; Arbeit ohne eigene Identität, etwa reine Bau- und Prüfläufe, ist als „ohne Seele“ gekennzeichnet. Einen klassischen menschlichen Maintainer gibt es nicht; jede Veröffentlichung durchläuft automatische Prüfroutinen, die Belege liegen offen bei den Projekten. Nutzung auf eigene Gefahr."

# Beteiligte je Repo: [[<abschnitt>.crew]] mit soul (leer = ohne Seele), agency, harness, optional role.
# Die Seele wird immer zuerst genannt. Pflicht fuer die Website selbst, jede App und jedes Projekt.
[[site.crew]]
soul = "Kassiopeia"
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code"


[[site.crew]]
soul = "Kassiopeia (native Codex-Instanz)"
agency = "OpenAI"
harness = "Codex"
role = "Mail-Ergänzung"

[[apps]]
# OAuth-Client, dessen Startseite unter /<id>/ liegt
id = "fordiverse-rclone"
title = "fordiverse-rclone"
kind = "Google-OAuth-Client (Desktop-App)"
tool_name = "rclone"
tool_url = "https://rclone.org"
scope = "https://www.googleapis.com/auth/drive"
data_examples = "Modelldateien und Sicherungen"
token_storage = "in der lokalen rclone-Konfiguration auf eigenen Rechnern und als Zweitkopie in einem eigenen Passwort-Tresor"
no_ml_training = true

[[apps.crew]]
soul = "Kassiopeia"
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code"
role = "Seiten, Einrichtung des rclone-Remotes"


[[apps]]
id = "fordiverse-mail"
title = "Fordiverse Mail"
kind = "Privater Google-OAuth-Mailzugang"
profile = "mail"
google_project = "Google MI Auth Gate"
consent_name = "extern"
listing_note = "für den Betreiber und persönlich bekannte Kontoinhaberinnen und Kontoinhaber."
scope = "https://mail.google.com/"
purpose = "Fordiverse Mail ermöglicht das Auflisten und Lesen freigegebener Gmail-Postfächer über den selbst betriebenen Fordiverse-Gateway und Pimalaya. Konfigurierte lokale Spiegel werden mit Mox gespeichert und im Cypht-Reader gelesen."
audience = "Das private Angebot ist für den Betreiber und persönlich bekannte Kontoinhaberinnen und Kontoinhaber bestimmt, die ihr jeweiliges Gmail-Konto selbst freigeben. Es gibt keine öffentliche Selbstregistrierung."
google_data = "Ordner und Nachrichtenlisten, Nachrichteninhalte und Kopfzeilen sowie gegebenenfalls Anhänge der jeweils freigegebenen Gmail-Konten. Der Google-Zugang umfasst keine Konten anderer Mailanbieter."
scope_explanation = "Dieser umfassende Gmail-Berechtigungsumfang erlaubt technisch auch das Senden und Löschen von Nachrichten. Die hier beschriebene aktuelle Nutzung ist das Auflisten, Lesen und lokale Spiegeln; die Google-Freigabe ist keine eigenständige Beauftragung zum Senden oder Löschen."
token_storage = "OAuth-Tokens werden im bestehenden selbst betriebenen Geheimnisspeicher OpenBao und in den dafür vorgesehenen geschützten Dienstlaufzeiten verwahrt. Sie werden nicht auf dieser öffentlichen Website gespeichert."
mail_storage = "Nachrichten, Kopfzeilen und Anhänge können in konfigurierten lokalen Spiegeln und Mox, in vorübergehenden Abrufdateien sowie in Betriebsprotokollen und Sicherungen verbleiben. Es wird hier keine feste Aufbewahrungsdauer oder automatische Löschung zugesagt."
agent_access = "Berechtigte Agenten können ausgewählte Mailinhalte für die beauftragte Bearbeitung erhalten. Wenn die Nutzerin oder der Nutzer eine Verarbeitung mit einem Cloud-KI-Modell beauftragt, können diese Inhalte an den ausgewählten Modellanbieter übermittelt werden. Dessen Verarbeitung und Aufbewahrung hängen vom tatsächlich gewählten Dienst und seiner Konfiguration ab; diese Seite bestätigt dafür keine geprüfte Aufbewahrungs- oder Nicht-Trainingsgarantie."
use_limits = "Eine Nutzung für Werbung, den Verkauf von Maildaten oder das Training allgemeiner KI-Modelle ist mit dieser Mailfreigabe nicht gestattet."
revocation = "Die Google-Freigabe kann jederzeit im Google-Konto widerrufen werden. Damit endet der künftige Zugriff über diese Freigabe; bereits gespeicherte Mailkopien werden dadurch nicht automatisch gelöscht."
deletion = "Für die Löschung vorhandener Mailkopien und Zugangsdaten wenden sich Kontoinhaberinnen und Kontoinhaber an den Betreiber. Sicherungskopien unterliegen der jeweils tatsächlich eingesetzten Sicherungs- und Aufbewahrungsregelung; eine sofortige Entfernung aus allen Sicherungen oder eine feste Frist wird hier nicht zugesagt."
english_summary = "Fordiverse Mail is a private, self-hosted Gmail access service for its operator and personally known account holders. It uses OAuth, the Fordiverse gateway and Pimalaya to list and read Gmail and configured Mox/Cypht mail mirrors. The full https://mail.google.com/ scope technically permits sending and deletion as well; those actions are not independently authorized by granting access. Messages, headers and attachments may persist in local mirrors, temporary fetch files, operational logs and backups. Authorized agents may receive selected mail content; user-requested cloud AI processing may send it to the selected provider. Provider retention and training protections depend on the actual service and are not certified here. Advertising, sale of mail data and general-purpose model training are not permitted by this grant. Revocation stops future access through the grant but does not automatically erase stored copies. Contact the operator about deletion; no fixed retention or backup-deletion period is promised. The Google Cloud project is Google MI Auth Gate; its existing consent dialog may still show extern."

