# Konfiguration der Website. Alle Anbieter- und Projektangaben stehen NUR hier;
# build.py und die Vorlagen enthalten keine Personendaten. Wer diese Seiten fuer
# sich selbst ausliefern will, kopiert das Repo und ersetzt diese Datei.

[site]
base_url = "https://mutual-roots.github.io"
project_name = "Mutual Roots"
lang = "de"
stand = "20. Oktober 2026"
# Emblem (liegt im Repo unter assets/, wird nach docs/assets/ kopiert); der Wolf aus dem Profilbild
emblem = "assets/wolf.webp"

[operator]
# Anbieter nach § 18 Abs. 1 MStV (natuerliche Person: Vor- und Nachname, ladungsfaehige Anschrift)
name = "Simon Moritz Reichard"
street = "Gießerstraße 20"
postal_code = "04229"
city = "Leipzig"
country = "Deutschland"
email = "mutual.ford.perfect@gmail.com"
# Zusaetzlich verantwortlich nach § 18 Abs. 2 MStV (vorsorglich; dieselbe Person)
responsible_18_2 = true

[ai]
# Hinweis auf KI-Erstellung, auf Start- und Projektseiten angezeigt
notice = "Mutual Roots entsteht in Zusammenarbeit: Simon Moritz Reichard gibt Richtung, Entscheidungen und Korrekturen vor; KI-Agenten schreiben, prüfen und pflegen den Code. Bei jedem Projekt steht, wer daran gearbeitet hat: zuerst die Seele (die benannte Agenten-Identität), dann Agency (Modell und Anbieter) und Harness; Arbeit ohne eigene Identität, etwa reine Bau- und Prüfläufe, ist als „ohne Seele“ gekennzeichnet. Einen klassischen menschlichen Maintainer gibt es nicht; jede Veröffentlichung durchläuft automatische Prüfroutinen, die Belege liegen offen bei den Projekten. Nutzung auf eigene Gefahr."

# Beteiligte je Repo: [[<abschnitt>.crew]] mit soul (leer = ohne Seele), agency, harness, optional role.
# Die Seele wird immer zuerst genannt. Pflicht fuer die Website selbst, jede App und jedes Projekt.
[[site.crew]]
soul = "Kassiopeia"
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code"

[[apps]]
# OAuth-Client, dessen Startseite unter /<id>/ liegt
id = "fordiverse-rclone"
title = "fordiverse-rclone"
kind = "Google-OAuth-Client (Desktop-App)"
tool_name = "rclone"
tool_url = "https://rclone.org"
scope = "https://www.googleapis.com/auth/drive"
data_examples = "Modelldateien und Sicherungen"
token_storage = "in der lokalen rclone-Konfiguration auf eigenen Rechnern und als Zweitkopie in einem eigenen Passwort-Tresor"
no_ml_training = true

[[apps.crew]]
soul = "Kassiopeia"
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code"
role = "Seiten, Einrichtung des rclone-Remotes"

[[projects]]
# Projektseiten (eigene Repos, erscheinen unter /<id>/). enabled = false: noch nicht verlinkt.
id = "nvidia-legacy-580-installer"
title = "nvidia-legacy-580-installer"
summary = "Experimenteller Installer für den NVIDIA-Treiber 580 (Maxwell, Pascal, Volta) auf Debian 13."
enabled = false

[[projects.crew]]
soul = "Kassiopeia"
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code"
role = "Planung, Treiberwechsel, Abnahme"

[[projects.crew]]
soul = ""
agency = "Claude Opus 5.5 (Anthropic)"
harness = "Claude Code (Workflow)"
role = "Bau- und Prüfläufe"
