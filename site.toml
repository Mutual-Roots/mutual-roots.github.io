[[apps]]
id = "fordiverse-mail"
title = "Fordiverse Mail"
kind = "Privater Google-OAuth-Mailzugang"
profile = "mail"
google_project = "Google MI Auth Gate"
consent_name = "extern"
listing_note = "für den Betreiber und persönlich bekannte Kontoinhaberinnen und Kontoinhaber."
scope = "https://mail.google.com/"
purpose = "Fordiverse Mail stellt freigegebene Gmail-Postfächer über kontogebundene API-/MCP-Schnittstellen und Pimalaya zum Auflisten und Lesen bereit. Mailkopien bleiben lokal in der selbst betriebenen Fordiverse-Installation; konfigurierte Spiegel werden mit Mox gespeichert und im Cypht-Reader gelesen."
audience = "Das private Angebot ist für den Betreiber und persönlich bekannte Kontoinhaberinnen und Kontoinhaber bestimmt, die ihr jeweiliges Gmail-Konto selbst freigeben. Es gibt keine öffentliche Selbstregistrierung."
google_data = "Ordner und Nachrichtenlisten, Nachrichteninhalte und Kopfzeilen sowie gegebenenfalls Anhänge der jeweils freigegebenen Gmail-Konten. Der Google-Zugang umfasst keine Konten anderer Mailanbieter."
scope_explanation = "Dieser umfassende Gmail-Berechtigungsumfang erlaubt technisch auch das Senden und Löschen von Nachrichten. Die hier beschriebene aktuelle Nutzung ist das Auflisten, Lesen und lokale Spiegeln; die Google-Freigabe ist keine eigenständige Beauftragung zum Senden oder Löschen."
token_storage = "OAuth-Tokens werden im bestehenden selbst betriebenen Geheimnisspeicher OpenBao und in den dafür vorgesehenen geschützten Dienstlaufzeiten verwahrt. Sie werden nicht auf dieser öffentlichen Website gespeichert."
mail_storage = "Mailkopien, Kopfzeilen und Anhänge werden lokal in der selbst betriebenen Installation für die vom Kontoinhaber beauftragte Postfachverwaltung, Spiegelung und Wiederherstellung aufbewahrt. Sie bleiben verfügbar, solange sie für diese Zwecke benötigt werden oder der Kontoinhaber ihre Aufbewahrung wünscht. Löschung und Beendigung der Aufbewahrung können beim Betreiber beauftragt werden. Vorübergehende Abrufdateien und betriebliche Sicherungen sind dabei gesondert zu berücksichtigen. Diese öffentliche Website speichert keine Mailinhalte."
data_protection = "Der Mailabruf erfolgt über verschlüsselte IMAPS-Verbindungen. Die Mail-Integration prüft das aktivierte Konto und die dafür freigegebenen Agenten. Vorübergehende Originaldateien und lokale Importdateien werden unter festgelegten Dienstkonten mit restriktiven Verzeichnis- und Dateirechten gespeichert. OAuth-Tokens liegen im dafür vorgesehenen geschützten Geheimnisspeicher. Diese Angaben beschreiben die eingesetzten Zugriffsschutzmechanismen und enthalten keine Zusage einer vollständigen Laufwerksverschlüsselung."
agent_access = "Agenten sind eigenständige, vom Kontoinhaber ausgewählte und freigegebene API-/MCP-Clients. Die Mailfunktion setzt kein eingebautes KI-Modell voraus. Nutzer können für ihre Clients eigene Anbieterzugänge verwenden (BYOK: Bring Your Own Key). Beauftragt ein Nutzer einen Client, bestimmte Maildaten an einen weiteren Dienst zu übermitteln, beauftragt er damit auch die Verarbeitung dieser Daten für den angegebenen Zweck nach den geltenden Datenschutz- und Aufbewahrungsbedingungen dieses Dienstes. Empfänger und Verwendungszweck müssen vor der Übermittlung bekannt und freigegeben sein. Eine Google-Freigabe oder ein eigener API-Schlüssel ersetzt diese Beauftragung nicht."
use_limits = "Fordiverse verwendet Google-Workspace-Daten nicht zur Entwicklung, Verbesserung oder zum Training nicht personalisierter KI- oder ML-Modelle. Ebenso werden diese Daten nicht für Werbung oder Datenverkauf verwendet. Eine Weitergabe an angebundene Clients und weitere Dienste ist ausschließlich für die beauftragten, nutzersichtbaren Mailfunktionen zulässig; die Empfänger müssen dieselben Limited-Use-Grenzen einhalten. Die eigenen Datenschutz- und Schutzpflichten von Fordiverse bleiben durch die Wahl eines externen Clients oder BYOK-Zugangs bestehen."
revocation = "Die Google-Freigabe kann jederzeit im Google-Konto widerrufen werden. Damit endet der künftige Zugriff über diese Freigabe; bereits gespeicherte Mailkopien werden dadurch nicht automatisch gelöscht."
deletion = "Kontoinhaber können die Löschung gespeicherter Mailkopien und Zugangsdaten über den unten genannten Kontakt beauftragen. Der Betreiber klärt dabei den Umfang der aktiven Kopien, vorübergehenden Abrufdateien und vorhandenen Sicherungen. Wiederherstellungskopien dienen ausschließlich der beauftragten Datensicherung; ihre weitere Aufbewahrung richtet sich nach der vom Kontoinhaber gewünschten Sicherungsregelung. Die Löschung einer aktiven Mailkopie entfernt bestehende Sicherungen nicht sofort. Der Widerruf der Google-Freigabe und die Löschung bereits gespeicherter Daten sind getrennte Schritte."
english_summary = "Fordiverse Mail provides account-scoped API/MCP access for listing and reading Gmail through Pimalaya, with local copies in the self-hosted installation and configured Mox/Cypht mirrors. Connected agents are independent clients selected and authorized by the account holder; the mail service does not require an embedded AI model. Users may configure their own provider credentials (Bring Your Own Key, BYOK). If you instruct a client to transmit specified mail data to another service, you also instruct that recipient to process those data for the stated task under its applicable data-protection and retention terms. The recipient and purpose must be disclosed and authorized before transmission. An OAuth grant or BYOK key alone does not authorize unrelated processing. Fordiverse does not use Google Workspace data to develop, improve, or train non-personalized AI/ML models, for advertising, or for selling data. Connected recipients must observe the same Limited Use restrictions. Choosing an external client or provider does not waive Fordiverse’s own data-protection obligations. Local copies are retained for the account holder’s requested mailbox and recovery purposes, for as long as needed or requested. Contact the operator to request deletion, including clarification of any retained backups. Revoking Google access does not automatically erase existing copies. The full Gmail OAuth scope technically also permits sending and permanent deletion; granting it is not a separate instruction to perform those actions. Retrieval uses encrypted IMAPS; account permissions and restrictive local fetch/import-file permissions protect access. The Google Cloud project is Google MI Auth Gate; its consent dialog may still show extern."

[apps.english]
kind = "Private Google OAuth mail access"
listing_note = "for the operator and personally known account holders."
purpose = "Fordiverse Mail provides account-scoped API/MCP interfaces and Pimalaya for listing and reading authorized Gmail mailboxes. Mail copies stay locally in the self-hosted Fordiverse installation; configured mirrors are stored with Mox and read in the Cypht reader."
audience = "This private service is for the operator and personally known account holders who authorize access to their own Gmail accounts. There is no public self-registration."
google_data = "Folders and message lists, message bodies and headers, and attachments where applicable, from the Gmail accounts that have been authorized. The Google grant does not cover accounts with other mail providers."
scope_explanation = "This broad Gmail scope technically also permits sending and deleting messages. The current use described here is listing, reading and local mirroring; granting Google access is not a separate instruction to send or delete messages."
token_storage = "OAuth tokens are held in the existing self-hosted OpenBao secret store and the designated protected service runtimes. They are not stored on this public website."
mail_storage = "Mail copies, headers and attachments are retained locally in the self-hosted installation for the mailbox management, mirroring and recovery requested by the account holder. They remain available for as long as needed for those purposes or as long as the account holder requests retention. Deletion and the end of retention can be requested from the operator. Temporary fetch files and operational backups must be considered separately. This public website stores no mail content."
data_protection = "Mail is retrieved over encrypted IMAPS connections. The mail integration checks the enabled account and the agents authorized for it. Temporary original-message files and local import files are stored under designated service accounts with restrictive directory and file permissions. OAuth tokens are held in the designated protected secret store. These statements describe the access controls in use and do not promise full-disk encryption."
agent_access = "Agents are independent API/MCP clients selected and authorized by the account holder. The mail function does not require an embedded AI model. Users can provide their own provider credentials for their clients (BYOK: Bring Your Own Key). When a user instructs a client to send specified mail data to another service, the user also instructs that recipient to process those data for the stated purpose under that service’s applicable data-protection and retention terms. The recipient and purpose must be known and authorized before transmission. A Google grant or a personal API key does not replace that instruction."
use_limits = "Fordiverse does not use Google Workspace data to develop, improve or train non-personalized AI or ML models. These data are not used for advertising or data sales either. Transfer to connected clients and other services is permitted only for the requested, user-facing mail functions; recipients must observe the same Limited Use restrictions. Choosing an external client or BYOK credentials does not remove Fordiverse’s own data-protection and security obligations."
revocation = "Google access can be revoked at any time in the Google account. This ends future access through that grant; it does not automatically delete mail copies that have already been stored."
deletion = "Account holders can request deletion of stored mail copies and credentials using the contact below. The operator clarifies the scope of active copies, temporary fetch files and existing backups. Recovery copies serve only the requested backup purpose; their continued retention follows the backup arrangement requested by the account holder. Deleting an active mail copy does not immediately remove existing backups. Revoking Google access and deleting data already stored are separate steps."

